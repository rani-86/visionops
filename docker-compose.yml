# Local, zero-cost version of the pipeline: LocalStack (S3 + SQS) + the real worker image.
#   docker compose up -d localstack
#   python local/bootstrap_localstack.py          # bucket, queues, S3->SQS notification, model upload
#   docker compose up --build worker
#   AWS_ENDPOINT_URL=http://localhost:4566 python scripts/load_test.py --bucket visionops-local --count 50
services:
  localstack:
    image: localstack/localstack:3.8
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,sqs
      AWS_DEFAULT_REGION: ap-south-1

  worker:
    build: .
    depends_on:
      - localstack
    environment:
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: ap-south-1
      VISIONOPS_BUCKET: visionops-local
      VISIONOPS_QUEUE_URL: http://localstack:4566/000000000000/visionops-jobs
      MODEL_VERSION: ${MODEL_VERSION:-v1}
      WAIT_SECONDS: "5"
    deploy:
      replicas: 1
