[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# data-heavy template/report lines read better unwrapped
"visionops/synth.py" = ["E501"]
"scripts/load_test.py" = ["E501"]
