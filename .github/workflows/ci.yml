name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Train a model for the smoke test
        run: |
          pip install -r requirements.txt
          python training/train.py --version v1 --no-mlflow
      - name: Build image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t visionops-worker:ci .
      - name: Smoke test real OCR + model inside the image
        run: |
          docker run --rm \
            -v "$PWD/artifacts/models/v1:/model:ro" \
            -v "$PWD/scripts/smoke_test.py:/app/smoke_test.py:ro" \
            -e LOCAL_MODEL_DIR=/model -e MODEL_VERSION=v1 \
            visionops-worker:ci python smoke_test.py
